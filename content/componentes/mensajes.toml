interp_titulo = "### 🔍 Interpretación de los Residuos"
media_ok = "✅ **Media de residuos cercana a 0:** El modelo está bien calibrado"   # |media| < 0.1·std
media_mal = "⚠️ **Media de residuos alejada de 0:** El modelo puede tener sesgo sistemático"
# CORREGIDO: la prueba es una correlación LINEAL (Pearson) entre ŷ y los residuos. Detecta un sesgo
# que crece o decrece con la predicción, pero no una curva (un patrón en U tiene r ≈ 0), así que
# no demuestra un "buen ajuste lineal" ni indica por sí sola relaciones no lineales.
# Python: "✅ **Sin correlación entre residuos y predicciones:** Buen ajuste lineal" y
# "⚠️ **Correlación detectada en residuos:** Puede haber relaciones no lineales".
corr_ok = "✅ **Sin correlación entre residuos y predicciones:** el error no aumenta ni disminuye de forma sistemática con el valor predicho"   # n > 10 y |r| < 0.1 (linregress(ŷ, residuos))
corr_mal = "⚠️ **Correlación detectada en residuos:** el modelo se equivoca de forma sistemática según el valor predicho (por ejemplo, se queda corto en los valores altos)"
# NUEVO (§4, caso n ≤ 10): Python lanzaba NameError; Rust omite la viñeta de correlación y muestra esta.
corr_pocas_muestras = "ℹ️ **Correlación de los residuos:** con 10 muestras de prueba o menos no se comprueba"
# CORREGIDO: solo se mide la asimetría (|skew| < 1); una distribución simétrica puede no ser normal
# (dos picos, colas largas). Python: "✅ **Distribución de residuos aproximadamente normal**".
normal_ok = "✅ **Distribución de residuos aproximadamente simétrica**"   # |skew| < 1 (scipy, sesgado)
normal_mal = "⚠️ **Distribución de residuos sesgada:** Revisar outliers o transformaciones"
item = "- {texto}"
sugerencias = "💡 **Sugerencias de mejora:** Considera probar transformaciones de variables, añadir características polinómicas, o usar modelos no lineales."   # st.info si falla alguna de las tres

