[interpretacion]
titulo = "### 🔍 Interpretación de Resultados"
# Regresión (st.info, líneas unidas con "\n"):
reg = ["**Resumen del Modelo:**", "- Tu modelo de regresión lineal explica **{r2_pct:.1f}%** de la variabilidad en los datos", "- En promedio, las predicciones se desvían **{mae:.2f} unidades** del valor real (MAE)", "- La raíz del error cuadrático medio es **{rmse:.2f} unidades** (RMSE)"]
reg_rmse_mayor = "\n- ⚠️ El RMSE es significativamente mayor que el MAE, lo que indica la presencia de algunos errores grandes"   # si rmse > 1.5·mae
# NUEVO: si r2 < 0 se añade esta línea (después de reg_rmse_mayor, si aparece). Python decía
# "explica **-12.3%** de la variabilidad" sin más. Nota para F3/F4: "regresión lineal" de `reg` es
# literal también en Árboles y KNN, donde no es correcto.
reg_r2_negativo = "\n- ⚠️ El R² es negativo: con los datos de prueba, el modelo predice peor que si diera siempre la media del objetivo"
# Clasificación (st.info): cada línea termina en "\n"
cls = ["**Resumen del Modelo:**", "- Tu modelo clasifica correctamente **{acc_pct:.1f}%** de los casos", "- De las predicciones positivas, **{prec_pct:.1f}%** son correctas (Precisión)", "- Detecta **{rec_pct:.1f}%** de todos los casos positivos reales (Recall)"]
cls_f1 = "- El F1-Score (balance entre precisión y recall) es **{f1:.3f}**\n\n"   # si f1 > 0
cls_mas_preciso = "- ⚖️ **Balance:** El modelo es más preciso pero menos sensible (más conservador)\n- 💡 **Sugerencia:** Si es importante detectar todos los casos positivos, considera ajustar el umbral de decisión\n\n"   # |p − r| > 0.1 y p > r
cls_mas_sensible = "- ⚖️ **Balance:** El modelo es más sensible pero menos preciso (más liberal)\n- 💡 **Sugerencia:** Si es importante evitar falsos positivos, considera ajustar el umbral de decisión\n\n"
cls_equilibrio = "- ⚖️ **Balance:** Buen equilibrio entre precisión y recall\n\n"
cls_mejorar = "🔍 **Recomendaciones para mejorar:**\n- Revisar la calidad y cantidad de datos de entrenamiento\n- Considerar ingeniería de características adicionales\n- Probar diferentes algoritmos de clasificación\n- Verificar si hay desbalance de clases\n"   # si accuracy < 0.6

