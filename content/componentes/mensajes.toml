# Textos cortos de los componentes compartidos de evaluación y visualización, literales.
# Los usan Regresión (F2) y, con los mismos textos, Árboles, KNN y Redes (F3–F5).
# Origen: mltutor/algorithms/model_evaluation.py, mltutor/viz/{roc,residual,decision_boundary,features}.py,
# mltutor/ui.py::create_prediction_interface y mltutor/utils.py. {x:.4f} = formato de Python.
# Textos largos (expanders): los .md de esta carpeta.
#
# Marcas:  "NUEVO (Dnn)" = texto que no existe en Python, exigido por una decisión de
# fase2-regresion.md §10.  "CORREGIDO" = el texto de Python era incorrecto; el literal original
# queda en el comentario "Python:". Los tests de paridad de textos deben usar el literal de Python
# solo para las claves que no llevan estas marcas.

