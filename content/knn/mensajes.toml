# NUEVO (fase4-knn.md §9.3.4): en KNN, `permutacion` sustituye a la de [importancia], cuyo ejemplo es un
# árbol de Diabetes con profundidad 10. Mismo texto con un ejemplo de KNN:
# tests/parity/knn/diabetes_k5_uniform_minkowski.json, s1 = −0,0224 ± 0,0249.
permutacion = """**Permutation Importance:**
- Mide cuánto empeora el modelo cuando se "rompe" cada característica
- Valores más altos = el modelo depende más de esa característica
- Valores pueden ser negativos: si son menores (en valor absoluto) que su desviación estándar, como s1 en 🩺 Diabetes con K = 5 (−0,022 ± 0,025), barajarla no empeora el modelo y la pequeña mejora es azar
- La desviación estándar indica la estabilidad de la medición"""
# NUEVO (D62): st.caption debajo de la tabla. En 🍷 Vino (K = 5) proline tiene 0,370, magnesium 0,043 y las
