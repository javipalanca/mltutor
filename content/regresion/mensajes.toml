log_todas_negativas = "⚠️ **Atención:** Todas las características reducen la probabilidad. Verifica que el modelo esté bien entrenado."   # st.warning
log_todas_positivas = "⚠️ **Atención:** Todas las características aumentan la probabilidad. Verifica que el modelo esté bien entrenado."
