# Textos cortos de la lección 📊 Regresión (mltutor/apps/linear_regression_app.py), literales.
# {llaves} = valores que se sustituyen; el formato numérico va indicado con la sintaxis de
# Python ({x:.4f}). Cabecera, subtítulo, pestañas y navbar: content/inicio/navegacion.toml.
# Expander de la cabecera: intro.md.

[entrenamiento]
header = "Configuración del Modelo"                          # st.header
info_titulo = "### Información del Dataset"
# a continuación create_info_box(dataset_info): la descripción del dataset (content/datasets/<id>.toml
