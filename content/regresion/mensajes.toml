# primera". Python: "**Nota:** Este es un modelo de clasificación multiclase con {n_clases} clases.
# Mostrando los coeficientes para la primera clase ({clase0})."
nota_multiclase = "**Nota:** Este es un modelo de clasificación multiclase con {n_clases} clases: cada clase tiene sus propios coeficientes y su propio intercepto. Mostrando los de la clase **{clase}**."   # st.info; {clase} = la elegida en el selector (al entrar, la 0)
selector_clase = "Selecciona la clase para mostrar coeficientes:"   # selectbox, opciones = índices, se muestran los nombres; índice 0
error_longitud = ["Error: Se encontraron {n_coef} coeficientes pero {n_feat} características.", "Forma de coef_: {shape}", "Características: {features}"]
error_proceso = ["Error al procesar los coeficientes: {error}", "Forma de model.coef_: {shape}", "Número de características: {n_feat}"]
tabla_titulo = "### 📊 Tabla de Coeficientes"
efecto_positivo = "📈 Positivo"                              # coef > 0
efecto_negativo = "📉 Negativo"                              # en otro caso (incluido 0)
importancia_alta = "🔥 Alta"                                 # |coef| > cuantil 0.75 de |coef|
importancia_media = "🔶 Media"                               # > cuantil 0.25
importancia_baja = "🔹 Baja"
# CORREGIDO (D27): la fuerza se decide por |coef|, simétrica para efectos positivos y negativos,
# como explica coeficientes-logistica.md. Python usaba OR > 7.4 / > 2.7 / (> 1.6 o < 0.625): un
# coeficiente −2.5 (OR 0.08, Hombre_Adulto en 🚢 Titanic) salía "Moderado".
fuerza_muy_fuerte = "🔥 Muy Fuerte"                          # |coef| > 2   (OR > 7.39 o < 0.135)
fuerza_fuerte = "🔥 Fuerte"                                  # |coef| > 1   (OR > 2.72 o < 0.368)
fuerza_moderado = "🔶 Moderado"                              # |coef| > 0.5 (OR > 1.65 o < 0.607)
fuerza_debil = "🔹 Débil"                                    # |coef| ≤ 0.5
columnas_lineal = ["Característica", "Coeficiente", "Efecto", "Importancia"]          # Coeficiente {:.4f}
columnas_logistica = ["Característica", "Coeficiente", "Odds Ratio", "Cambio en Odds", "Efecto", "Fuerza del Efecto"]   # {:.4f}, {:.3f}, {:+.1f}%
tabla_expander = "📖 ¿Cómo leer esta tabla?"                 # tabla-lineal.md / tabla-logistica.md
intercepto_titulo = "### 🎯 Intercepto del Modelo"
# CORREGIDO (D27): el intercepto es el de la clase elegida (Python mostraba siempre intercept_[0]).
intercepto_metric = "Intercepto"                             # {:.4f}
# CORREGIDO: e^β₀ son las odds cuando todo vale 0, no un odds ratio (un odds ratio compara dos
# odds). Python: "Odds Ratio Base". Solo en logística binaria; en multiclase no se muestra.
odds_base_metric = "Odds base"                               # {:.3f} = e^intercepto
# CORREGIDO: Python: "**Interpretación:** Cuando todas las características son 0, el log-odds base es
# {intercepto:.4f} (Odds Ratio = {odds:.3f})". {clase} = clase positiva (la de código 1).
intercepto_info_logistica = "**Interpretación:** Cuando todas las características valen 0, el log-odds de la clase positiva (**{clase}**) es {intercepto:.4f}, es decir, unas odds de {odds:.3f} (probabilidad {prob:.1%})."   # {prob} = odds / (1 + odds)
# NUEVO (D27): logística multiclase.
intercepto_info_multiclase = "**Interpretación:** Cuando todas las características valen 0, la puntuación (logit) de la clase **{clase}** es {intercepto:.4f}. En multiclase no es un log-odds por sí sola: la probabilidad de cada clase sale de comparar las puntuaciones de todas (softmax)."
intercepto_info_lineal = "**Interpretación:** Cuando todas las características son 0, el modelo predice un valor de {intercepto:.4f}"
grafico_titulo = "### 📈 Visualización de Coeficientes"
grafico_title = "Coeficientes del Modelo (ordenados por importancia)"
grafico_xlabel = "Valor del Coeficiente"
grafico_leyenda = ["Efecto Positivo", "Efecto Negativo"]     # colores #4ecdc4 y #ff6b6b, alpha 0.7
analisis_titulo = "### 🔍 Análisis Detallado de Importancia"
# Logística
log_aumentan = "#### 🎯 **Características que MÁS aumentan la probabilidad:**"
log_disminuyen = "#### 📉 **Características que MÁS disminuyen la probabilidad:**"
# CORREGIDO (D27): {n} = puesto en la lista, 1, 2, 3. Python ponía la posición original de la
