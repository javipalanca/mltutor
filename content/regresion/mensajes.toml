# NUEVO (D27): en multiclase, debajo de analisis_titulo, para que "odds" no se lea como en binaria.
nota_odds_multiclase = "ℹ️ **En multiclase** cada clase tiene su propio vector de coeficientes y las «odds» de la clase **{clase}** se miden frente a una clase promedio (la media geométrica de las probabilidades de todas las clases). Para comparar dos clases concretas *k* y *l*, el odds ratio de una característica es e^(βₖ − βₗ), con los coeficientes de esa característica en cada clase."
log_item_pos = """**{n}. {caracteristica}** {intensidad}
- Coeficiente: `{coef:.4f}`
- Odds Ratio: `{odds:.3f}`
- **Impacto:** Cada unidad adicional **multiplica las odds por {odds:.2f}** (aumenta {cambio:+.1f}%)"""
log_item_neg = """**{n}. {caracteristica}** {intensidad}
- Coeficiente: `{coef:.4f}`
- Odds Ratio: `{odds:.3f}`
- **Impacto:** Cada unidad adicional **reduce las odds en {reduccion:.1f}%**"""
intensidad_fuerte = "🔥 **FUERTE**"      # logística +: OR > 3; −: OR < 0.33. Lineal: |coef| > cuantil 0.8
