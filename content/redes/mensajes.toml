# Textos cortos de la lección 🧠 Redes Neuronales, literales (mltutor/apps/neural_network_app.py,
# mltutor/viz/nn.py, mltutor/algorithms/model_training.py::train_neural_network,
# mltutor/algorithms/model_evaluation.py::neural_network_diagnostics y siguientes,
# mltutor/algorithms/export.py::show_neural_network_export, mltutor/ui.py::create_prediction_interface).
# {llaves} = valores que se sustituyen; formato numérico con la sintaxis de Python ({x:.3f}, {n:,}).
# Cabecera, subtítulo, pestañas y navbar: content/inicio/navegacion.toml [lessons.redes]. Expander de la
# cabecera: intro.md. Textos largos: los .md de esta carpeta. Textos de los componentes compartidos
# (evaluación C1/C2/C3, formulario C9, bloques de código): content/componentes/mensajes.toml.
#
# Marcas:  "NUEVO (Dnn)" = no existe en Python, lo exige una decisión de fase5-redes.md §10.
# "CORREGIDO (Dnn)" = el texto de Python era incorrecto; el literal original queda en el comentario
# "Python:". "(inalcanzable)" = existe en el código Python pero el estudiante nunca lo ve (§12).
# Los tests de paridad de textos (tests/parity/nn/*.json) usan el literal de Python para las claves sin marca.

