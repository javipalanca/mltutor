ir_a_visualizacion = "👉 Ve a la pestaña '📉 Visualización' para ver el árbol generado."   # st.info
error_entrenar = "Error al entrenar el modelo: {error}"      # st.error
# NUEVO (D37): st.error en lugar de entrenar un clasificador con un objetivo continuo (Python
