# continuous..."). {dataset} = nombre del dataset.
error_clasificacion_regresion = "Un árbol de clasificación necesita una variable objetivo con clases. Elige 📈 Regresión o un dataset de clasificación."
error_clasificacion_regresion_detalle = "En **{dataset}** el objetivo es un número continuo. Si se forzara la clasificación, cada valor distinto del objetivo se convertiría en una «clase» con uno o dos ejemplos (en 🩺 Diabetes saldrían cerca de 200) y el árbol no tendría sentido."   # st.info debajo del error

