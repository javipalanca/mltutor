# Textos cortos de la lección 🌲 Árboles de Decisión (mltutor/apps/decission_tree_app.py,
# mltutor/algorithms/export.py::display_tree_export_options,
# mltutor/algorithms/model_evaluation.py::show_prediction_path), literales.
# {llaves} = valores que se sustituyen; formato numérico con la sintaxis de Python ({x:.4f}).
# Cabecera, subtítulo, pestañas y navbar: content/inicio/navegacion.toml. Expander de la cabecera:
# intro.md. Textos de los componentes compartidos (evaluación, ROC, residuos, frontera, formulario,
# importancia, bloques de código): content/componentes/mensajes.toml.
#
# Marcas:  "NUEVO (Dnn)" = texto que no existe en Python, exigido por una decisión de
# fase3-arboles.md §10.  "CORREGIDO (Dnn)" = el texto de Python era incorrecto; el literal
# original queda en el comentario "Python:". Los tests de paridad de textos usan el literal de
# Python solo para las claves sin marca.

