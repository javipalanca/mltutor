criterio_opciones_regresion = ["squared_error", "friedman_mse", "absolute_error"]
criterio_help = "Medida de la calidad de una división. Gini o Entropy para clasificación, MSE para regresión."
profundidad_label = "Profundidad Máxima:"                    # slider 1..10, 3
profundidad_help = "La profundidad máxima del árbol. A mayor profundidad, más complejo el modelo."
