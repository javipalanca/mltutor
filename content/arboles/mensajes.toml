[caracteristicas]
header = "Importancia de Características"
# El contenido es el componente C10 (content/componentes/mensajes.toml [importancia]).
# NUEVO (D38): panel de dos subvistas; la primera es la de Python.
panel = [["🌳 Importancia del modelo", "Nativa", "imp_native"], ["🔀 Importancia por permutación", "Permutacion", "imp_permutation"]]

[predicciones]
header = "🔮 Predicciones con Nuevos Datos"
# Formulario y tarjeta: content/componentes/mensajes.toml [prediccion]; camino_titulo = "### Camino de decisión"
# show_prediction_path: una línea por nodo interno del camino (la hoja no se describe), unidas con "\n".
# {valor} es la entrada convertida a float32; {umbral} el umbral float64 del nodo.
camino_menor_igual = "- {nombre} = {valor:.4f} ≤ {umbral:.4f} ✅"
camino_mayor = "- {nombre} = {valor:.4f} > {umbral:.4f} ✅"
codigo_camino = "Código para generar el camino de decisión"   # camino_decision.py (content/code/camino_decision.py.j2)
error_camino = "Error al mostrar el camino de decisión: {error}"
error_camino_info = "Intenta reformatear los datos de entrada o verificar que el modelo sea compatible."
# NUEVO (D46): última línea del camino y tabla de probabilidades de la hoja (clasificación).
camino_hoja_clasificacion = "- 🍃 Hoja {nodo}: **{clase}** (probabilidad {probabilidad:.3f}, {muestras} muestras de entrenamiento)"
camino_hoja_regresion = "- 🍃 Hoja {nodo}: **{valor:.4f}** (media de {muestras} muestras de entrenamiento)"
camino_hoja_regresion_mediana = "- 🍃 Hoja {nodo}: **{valor:.4f}** (mediana de {muestras} muestras de entrenamiento)"   # absolute_error
# NUEVO (D46): valor legible de las características categóricas en el camino, p. ej. "Sexo = 0 (Mujer)".
camino_valor_categorico = "{codigo:g} ({etiqueta})"

