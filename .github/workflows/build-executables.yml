name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - 'mltutor/**'
      - 'tests/**'
      - 'launcher_qt.py'
      - 'pyinstaller.spec'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-executables.yml'

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Portable Qt (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Build machine libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libnss3 libasound2 libgbm1 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxss1 xvfb \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - name: Install build dependencies
        run: uv sync --locked --extra dev
      - name: Test lessons and native controls
        run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          TF_CPP_MIN_LOG_LEVEL: '3'
      - name: Build portable application
        run: uv run pyinstaller pyinstaller.spec --noconfirm
      - name: Verify models and exports inside the executable (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: ./dist/MLTutor --verify-models
      - name: Verify models and exports inside the executable (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: ./dist/MLTutor.app/Contents/MacOS/MLTutor --verify-models
      - name: Verify models and exports inside the executable (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/MLTutor.exe" -ArgumentList "--verify-models" -PassThru
          if (-not $p.WaitForExit(420000)) {
            Stop-Process -Id $p.Id -Force
            throw "La comprobación de modelos no terminó"
          }
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:USERPROFILE\.mltutor\mltutor.log" -Tail 100 -ErrorAction SilentlyContinue
            throw "Modelos o exportaciones fallidos: $($p.ExitCode)"
          }
      - name: Smoke test portable application (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: xvfb-run -a ./dist/MLTutor --smoke-test
      - name: Smoke test portable application (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: ./dist/MLTutor.app/Contents/MacOS/MLTutor --smoke-test
      - name: Smoke test portable application (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/MLTutor.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(420000)) {
            Stop-Process -Id $p.Id -Force
            throw "MLTutor no terminó la prueba de arranque"
          }
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:USERPROFILE\.mltutor\mltutor.log" -Tail 100 -ErrorAction SilentlyContinue
            throw "Prueba de aplicación fallida: $($p.ExitCode)"
          }
      - name: Package portable downloads
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) cp dist/MLTutor.exe mltutor-${{ matrix.platform }}.exe ;;
            macOS) ditto -c -k --sequesterRsrc --keepParent dist/MLTutor.app mltutor-${{ matrix.platform }}.zip ;;
            Linux) cp dist/MLTutor mltutor-${{ matrix.platform }}; chmod +x mltutor-${{ matrix.platform }} ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: mltutor-${{ matrix.platform }}
          path: mltutor-${{ matrix.platform }}*
          retention-days: 14
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Verify all three downloads and generate checksums
        run: |
          test -s mltutor-windows-x86_64.exe
          test -s mltutor-linux-x86_64
          test -s mltutor-macos-arm64.zip
          sha256sum mltutor-windows-x86_64.exe mltutor-linux-x86_64 mltutor-macos-arm64.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mltutor-windows-x86_64.exe
            mltutor-linux-x86_64
            mltutor-macos-arm64.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            MLTutor de escritorio con Qt. Descargas portables, sin instalador ni Python/Qt externos.

            - Windows x86_64: abrir el archivo `.exe`.
            - macOS Apple Silicon: descomprimir el ZIP y abrir `MLTutor.app` desde esa carpeta.
            - Linux x86_64 (Ubuntu 22.04 o compatible): dar permiso de ejecución al archivo y abrirlo.

            Esta compilación supera las pruebas de lecciones, arranque y exportación de modelos en los tres sistemas.
            macOS aún no dispone de firma Developer ID ni notarización, por lo que puede mostrar avisos de confianza.
            Los equipos deben permitir ejecutar aplicaciones descargadas. No se necesitan permisos de instalación.
