<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Página no encontrada · MLTutor</title>
  <!-- Self-contained on purpose: GitHub Pages serves this file for any missing path under the
       site, at any depth, so relative links to assets/ would not resolve. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light dark; --bg: #f6f8fc; --text: #0f172a; --muted: #526073; --primary: #1976d2; --card: #fff; --border: #d5deeb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --text: #e6edf7; --muted: #9fb0c8; --primary: #1d6fc9; --card: #121c31; --border: #25334d; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      background: var(--bg); color: var(--text); line-height: 1.6; }
    main { max-width: 32rem; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem 2rem; }
    .big { font-size: 3.5rem; margin: 0; line-height: 1; }
    h1 { font-size: 1.6rem; margin: 1rem 0 .5rem; }
    p { color: var(--muted); }
    a.btn { display: inline-block; margin-top: .5rem; padding: .75rem 1.2rem; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 650; text-decoration: none; }
    a:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
    small { display: block; margin-top: 1.5rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="big" aria-hidden="true">🌲❓</p>
    <h1>Esta página no está en el árbol</h1>
    <p>Hemos seguido todas las ramas y la página que buscas no aparece. Quizá el enlace está mal escrito o la página ya no existe.</p>
    <a class="btn" id="home" href="./">🎓 Volver a MLTutor</a>
    <small>Error 404</small>
  </main>
  <script>
    // GitHub Pages serves this page for a missing path at any depth under the project site
    // (/mltutor/…). Build a RELATIVE link back to the site root: one "../" per directory.
    (function () {
      var path = location.pathname;
      var dirs = path.slice(0, path.lastIndexOf("/") + 1).split("/").filter(Boolean);
      var rootDepth = dirs[0] === "mltutor" ? 1 : 0;
      var ups = Math.max(0, dirs.length - rootDepth);
      document.getElementById("home").href = ups ? new Array(ups + 1).join("../") : "./";
    })();
  </script>
</body>
</html>
