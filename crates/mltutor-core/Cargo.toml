[package]
name = "mltutor-core"
description = "Algorithms, metrics, preprocessing and embedded datasets for MLTutor (no UI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# ndarray 0.16 is the version linfa 0.8 requires (MEMORY: spike 2026-10-13). No BLAS.
ndarray = { version = "0.16", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
csv = "1.3"
encoding_rs = "0.8"
toml = { version = "0.8", default-features = false, features = ["parse"] }
rand_mt = { version = "6.1", default-features = false }
indexmap = "2"
# TextColumn: hash table of codes over one string buffer (already used by indexmap).
hashbrown = { version = "0.17", default-features = false }
# F2 linear models (MEMORY: spike 2026-10-13). OLS goes through linfa-linear (QR); the
# logistic regression uses the same L-BFGS + More-Thuente solver as linfa-logistic, called
# directly so that training can be cancelled and report iterations/convergence.
linfa = { version = "0.8.1", default-features = false }
linfa-linear = { version = "0.8.1", default-features = false }
linfa-linalg = { version = "0.2", default-features = false }
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", default-features = false, features = ["ndarray_v0_16-nolinalg"] }
# Python code shown to the student (content/code/*.py.j2).
minijinja = { version = "3", default-features = false, features = ["builtins", "macros", "multi_template", "serde", "std_collections", "preserve_order"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
approx = "0.5"
# Only to check that our objective is linfa-logistic's with alpha = 1/C.
linfa-logistic = { version = "0.8.1", default-features = false }
sha2 = "0.10"
base64 = "0.22"
proptest = "1"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
# csv_memory.rs: peak RSS via getrusage.
libc = "0.2"

[lints]
workspace = true
