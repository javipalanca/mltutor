[package]
name = "mltutor-nn"
description = "Neural networks for MLTutor: a float32 MLP with Keras 3.12 semantics (training, history, views)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# D68 (fase5-redes.md §8): own MLP with manual backprop, no burn. Shares ndarray 0.16,
# RandomState (MT19937) and the lesson types with the core.
mltutor-core.workspace = true
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
# Deterministic parallel matrix products (every output keeps its summation order, so
# the result does not depend on the number of threads; review F5a, finding 2).
rayon = "1.10"

[dev-dependencies]
approx = "0.5"
# Benchmarks only (benches/, docs/migration/benchmarks.md); never in the app binary.
# 0.7: the last release whose MSRV (1.80) is below the workspace's 1.85.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
base64 = "0.22"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

# `cargo bench -- --save-baseline x` passes criterion's flags to every bench target:
# the lib's libtest harness would reject them.
[lib]
bench = false

[[bench]]
name = "nn"
harness = false

[lints]
workspace = true
